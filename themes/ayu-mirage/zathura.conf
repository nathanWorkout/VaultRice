set default-bg "#1F2430"
set default-fg "#D3E3FC"

set statusbar-bg "#282E3B"
set statusbar-fg "#D3E3FC"
set statusbar-h-padding 8
set statusbar-v-padding 3

set inputbar-bg "#282E3B"
set inputbar-fg "#D3E3FC"

set notification-bg "#282E3B"
set notification-fg "#D3E3FC"
set notification-error-bg "#FF6666"
set notification-error-fg "#D3E3FC"
set notification-warning-bg "#FFCC66"
set notification-warning-fg "#D3E3FC"

set highlight-color "rgba(255,204,102,0.35)"
set highlight-active-color "rgba(255,204,102,0.6)"
set highlight-fg "#D3E3FC"

set completion-bg "#1F2430"
set completion-fg "#D3E3FC"
set completion-group-bg "#282E3B"
set completion-group-fg "#FFCC66"
set completion-highlight-bg "#FFCC66"
set completion-highlight-fg "#1F2430"

set index-bg "#1F2430"
set index-fg "#D3E3FC"
set index-active-bg "#FFCC66"
set index-active-fg "#1F2430"

set render-loading-bg "#1F2430"
set render-loading-fg "#D3E3FC"
set recolor-lightcolor "#1F2430"
set recolor-darkcolor "#D3E3FC"
