set statusbar-bg "#343f44"
set statusbar-fg "#d3c6aa"
set statusbar-h-padding 8
set statusbar-v-padding 3

set inputbar-bg "#343f44"
set inputbar-fg "#d3c6aa"

set notification-bg "#343f44"
set notification-fg "#d3c6aa"
set notification-error-bg "#e67e80"
set notification-error-fg "#d3c6aa"
set notification-warning-bg "#a7c080"
set notification-warning-fg "#d3c6aa"

set highlight-color "rgba(167,192,128,0.35)"
set highlight-active-color "rgba(167,192,128,0.6)"
