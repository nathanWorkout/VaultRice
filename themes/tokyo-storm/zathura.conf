set default-bg "#24283b"
set default-fg "#c0caf5"

set statusbar-bg "#292e42"
set statusbar-fg "#c0caf5"
set statusbar-h-padding 8
set statusbar-v-padding 3

set inputbar-bg "#292e42"
set inputbar-fg "#c0caf5"

set notification-bg "#292e42"
set notification-fg "#c0caf5"
set notification-error-bg "#f7768e"
set notification-error-fg "#c0caf5"
set notification-warning-bg "#7dcfff"
set notification-warning-fg "#c0caf5"

set highlight-color "rgba(125,207,255,0.35)"
set highlight-active-color "rgba(125,207,255,0.6)"
set highlight-fg "#c0caf5"

set completion-bg "#24283b"
set completion-fg "#c0caf5"
set completion-group-bg "#292e42"
set completion-group-fg "#7dcfff"
set completion-highlight-bg "#7dcfff"
set completion-highlight-fg "#24283b"

set index-bg "#24283b"
set index-fg "#c0caf5"
